<div class="auth-container">
    <div class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to manage your profile</p>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Email</label>
                <input type="email" [(ngModel)]="credentials.email" name="email" placeholder="example@example.com"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" [(ngModel)]="credentials.password" name="password" required>
            </div>

            <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

            <button type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Signing in...' : 'Sign In' }}
            </button>
        </form>

        <div class="footer">
            Don't have an account? <a routerLink="/register">Register here</a>
        </div>
    </div>
</div>
