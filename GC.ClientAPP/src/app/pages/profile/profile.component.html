<app-navbar></app-navbar>

<div class="container">
  <div class="profile-card">
    <header>
      <h1>My Profile</h1>
      <p>Manage your professional details visible to patients.</p>
    </header>

    <div *ngIf="isLoading()" class="loading">Loading profile...</div>

    <form *ngIf="!isLoading()" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Email</label>
        <input type="text" [value]="profile.email" disabled class="read-only">
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="profile.name" name="name" required>
      </div>

      <div class="form-group">
        <label>Specialty</label>
        <input 
          type="text" 
          [(ngModel)]="profile.specialty" 
          name="specialty" 
          placeholder="e.g. Cardiology, Pediatrics"
        >
      </div>

      <div class="form-group">
        <label>Google Booking URL</label>
        <input 
          type="url" 
          [(ngModel)]="profile.googleBookingUrl" 
          name="bookingUrl" 
          placeholder="https://calendar.app.google/..."
        >
        <small>Paste your Google Calendar Appointment Slot link here.</small>
      </div>

      <div class="form-group">
        <label>Bio / About Me</label>
        <textarea 
          [(ngModel)]="profile.bio" 
          name="bio" 
          rows="4" 
          placeholder="Brief description about your experience..."
        ></textarea>
      </div>

      <div *ngIf="message().text" class="alert" [class.success]="message().type === 'success'" [class.error]="message().type === 'error'">
        {{ message().text }}
      </div>

      <button type="submit" [disabled]="isSaving()" class="btn-save">
        {{ isSaving() ? 'Saving...' : 'Save Changes' }}
      </button>

    </form>
  </div>
</div>
