<div class="container">
      <div *ngIf="loading()" class="loading">Loading details...</div>

      <div *ngIf="!loading() && provider()" class="profile-card">
        <div class="photo-wrapper">
          <img [src]="provider().photoUrl || 'assets/default-avatar.png'" alt="Doctor Photo">
        </div>

        <div class="info">
          <h1>{{ provider().name }}</h1>
          <span class="specialty">{{ provider().specialty }}</span>
          
          <div class="badges">
            <span class="badge" *ngIf="provider().nationality">📍 {{ provider().nationality }}</span>
          </div>

          <p class="bio">{{ provider().bio || 'No bio available.' }}</p>

          <a [href]="provider().googleBookingUrl" target="_blank" class="btn-book">
            📅 Book Appointment
          </a>
        </div>
      </div>

      <div *ngIf="!loading() && !provider()" class="error">
        Provider not found.
      </div>
    </div>
