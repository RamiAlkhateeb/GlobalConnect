<div class="auth-container">
    <div class="card">
        <h2>Join RemoteCare</h2>
        <p class="subtitle">Create your provider account</p>

        <form *ngIf="!isSuccess" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" [(ngModel)]="formData.name" name="name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" [(ngModel)]="formData.email" name="email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" [(ngModel)]="formData.password" name="password" required>
            </div>

            <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

            <button type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Registering...' : 'Sign Up' }}
            </button>
        </form>

        <div *ngIf="isSuccess" class="success-state">
            <div class="check-icon">✓</div>
            <h3>Registration Successful!</h3>
            <p>Your account is pending approval. Please wait for the admin to activate your account.</p>
            <a routerLink="/login" class="btn-link">Back to Login</a>
        </div>

        <div *ngIf="!isSuccess" class="footer">
            Already have an account? <a routerLink="/login">Login here</a>
        </div>
    </div>
</div>
